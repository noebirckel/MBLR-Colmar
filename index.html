const _REONIC_SYSTEM_PATTERNS = [
  "erstellt mittels api", "created via api", "api-integration",
  "api integration", "automatically created", "automatisch erstellt",
];
const _isReonicSystemMsg = txt =>
  _REONIC_SYSTEM_PATTERNS.some(p => (txt || "").toLowerCase().includes(p));

// Normalise un numéro de téléphone pour la déduplication :
// supprime tout sauf les chiffres, convertit +33XXXXXXXXX → 0XXXXXXXXX
const normalizePhone = p => {
  if (!p) return "";
  const digits = (p + "").replace(/\D/g, "");
  if (digits.startsWith("33") && digits.length === 11) return "0" + digits.slice(2);
  if (digits.startsWith("0033") && digits.length === 13) return "0" + digits.slice(4);
  return digits;
};

const extractReonicMessage = raw => {
  if (!raw) return "";
  if (Array.isArray(raw)) {
    const msgs = raw.map(n => (n && n.message) || "").filter(m => m && !_isReonicSystemMsg(m));
    return msgs.join(" | ") || "";
  }
  if (typeof raw === "string" && raw.trim().startsWith("[")) {
    try {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        const msgs = arr.map(n => (n && n.message) || "").filter(m => m && !_isReonicSystemMsg(m));
        return msgs.join(" | ") || "";
      }
    } catch (e) {}
  }
  return typeof raw === "string" ? raw : "";
};
